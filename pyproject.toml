[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "failfast"
version = "0.1.0"
description = "Reorders test suites so the tests most likely to fail run first, using ML on code changes and test history."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Shiva Kumar S.M", email = "shivukumar.iu@gmail.com" },
]
keywords = ["pytest", "ci", "machine-learning", "test-prioritization", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.1",
    "coverage>=7.0",
    "pytest>=8.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "black>=24.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
ml = [
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
failfast = "failfast.cli:main"

[project.urls]
Homepage = "https://github.com/Shiva-Kumar-S-M/failfast"
Repository = "https://github.com/Shiva-Kumar-S-M/failfast"
"Bug Tracker" = "https://github.com/Shiva-Kumar-S-M/failfast/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["failfast*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long – handled by black
]

[tool.ruff.lint.isort]
known-first-party = ["failfast"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["failfast"]
omit = ["tests/*", "failfast/cli.py"]

[tool.coverage.report]
show_missing = true
fail_under = 85
